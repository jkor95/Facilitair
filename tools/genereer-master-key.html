<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dalton sleutelgenerator</title><style>body{font-family:system-ui;max-width:720px;margin:50px auto;padding:20px}button{padding:12px 16px}pre{padding:15px;background:#f1f4f5;border-radius:12px;overflow:auto}</style><h1>DALTON_MASTER_KEY genereren</h1><p>Deze pagina werkt volledig lokaal in je browser. Klik op de knop, kopieer de sleutel en sla hem op als Supabase Edge Function secret.</p><button id="b">Genereer 32-byte sleutel</button><pre id="o">Nog geen sleutel.</pre><script>b.onclick=()=>{const x=crypto.getRandomValues(new Uint8Array(32));let s='';x.forEach(v=>s+=String.fromCharCode(v));o.textContent=btoa(s)}</script></html>
